name: CI

on: [push, pull_request, workflow_dispatch]

defaults:
  run:
    shell: bash

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.dotnet.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Linux, os: ubuntu-latest }
        - { name: Windows VS2022, os: windows-2022 }
        dotnet:
        - { name: .NET 9, version: '9.0.x' }
        - { name: .NET 10, version: '10.0.x' }
        - { name: .NET 11, version: '11.0.x' }

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Setup .NET ${{ matrix.dotnet.version }} SDK
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet.version }}
      - name: Enforce SDK Version
        env:
          DOTNET_VERSION: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$DOTNET_VERSION" --force
      - name: Verify SDK Installation
        run: dotnet --info
      - name: Install Dependencies
        run: dotnet restore AeroMessages/AeroMessages.csproj
      - name: Build
        run: dotnet build AeroMessages/AeroMessages.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish AeroMessages/AeroMessages.csproj --configuration Release --no-build --output AeroMessages/bin/Publish
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AeroMessages-${{ matrix.platform.os }}-${{ matrix.dotnet.version }}
          path: AeroMessages/bin/Publish/AeroMessages.dll
